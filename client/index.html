<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="DataShare — Share text and files instantly with a unique code and QR. No sign-up needed. Data auto-expires for privacy." />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DataShare" />
  <title>DataShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cedarville+Cursive&family=Homemade+Apple&family=Satisfy&display=swap" rel="stylesheet" />
</head>

<body>
  <script>
    // Apply saved theme BEFORE React loads to prevent flash
    (function () {
      var theme = localStorage.getItem('datashare-theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/sw.js')
          .then((reg) => console.log('SW registered:', reg.scope))
          .catch((err) => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>

</html>
