<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="DataShare — Share text and files instantly with a unique code and QR. No sign-up needed. Data auto-expires for privacy." />
  <meta name="theme-color" content="#f59e0b" />
  <title>DataShare — Share Instantly</title>
</head>

<body>
  <script>
    // Apply saved theme BEFORE React loads to prevent flash
    (function () {
      var theme = localStorage.getItem('datashare-theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
